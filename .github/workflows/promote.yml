name: Promote Application Images

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  promote:
    name: Promote Latest Validated Images
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # CHECKOUT INFRASTRUCTURE
      # ----------------------------------------------------
      - name: Checkout infrastructure
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      # ----------------------------------------------------
      # FIND LATEST SUCCESSFUL BACKEND BUILD
      # ----------------------------------------------------
      - name: Find latest successful backend build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BACKEND_SHA="$(
            gh run list \
              --repo jujistu/go-backend-ci-cd \
              --workflow phase2.yml \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha'
          )"

          if [ -z "$BACKEND_SHA" ]; then
            echo "No successful backend build found."
            exit 1
          fi

          echo "Backend SHA: $BACKEND_SHA"
          echo "BACKEND_SHA=$BACKEND_SHA" >> "$GITHUB_ENV"

      # ----------------------------------------------------
      # FIND LATEST SUCCESSFUL FRONTEND BUILD
      # ----------------------------------------------------
      - name: Find latest successful frontend build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FRONTEND_SHA="$(
            gh run list \
              --repo jujistu/frontend-ci-cd \
              --workflow phase2.yml \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha'
          )"

          if [ -z "$FRONTEND_SHA" ]; then
            echo "No successful frontend build found."
            exit 1
          fi

          echo "Frontend SHA: $FRONTEND_SHA"
          echo "FRONTEND_SHA=$FRONTEND_SHA" >> "$GITHUB_ENV"

      # ----------------------------------------------------
      # FIND LATEST SUCCESSFUL STOCKBOT BUILD
      # ----------------------------------------------------
      - name: Find latest successful stockbot build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          STOCKBOT_SHA="$(
            gh run list \
              --repo jujistu/stock-bot \
              --workflow container.yml \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha'
          )"

          if [ -z "$STOCKBOT_SHA" ]; then
            echo "No successful stockbot build found."
            exit 1
          fi

          echo "Stockbot SHA: $STOCKBOT_SHA"
          echo "STOCKBOT_SHA=$STOCKBOT_SHA" >> "$GITHUB_ENV"

      # ----------------------------------------------------
      # SHOW SELECTED PROMOTION
      # ----------------------------------------------------
      - name: Show selected promotion
        run: |
          echo "========================================"
          echo "       SELECTED PROMOTION"
          echo "========================================"
          echo "Backend:  ${BACKEND_SHA}"
          echo "Frontend: ${FRONTEND_SHA}"
          echo "Stockbot:  ${STOCKBOT_SHA}"
          echo "========================================"

      # ----------------------------------------------------
      # VALIDATE SHA FORMAT
      # ----------------------------------------------------
      - name: Validate image references
        run: |
          set -euo pipefail

          for value in \
            "$BACKEND_SHA" \
            "$FRONTEND_SHA" \
            "$STOCKBOT_SHA"
          do
            if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Invalid image SHA: $value"
              exit 1
            fi
          done

      # ----------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # VERIFY IMAGES EXIST
      # ----------------------------------------------------
      - name: Verify images exist in GHCR
        run: |
          set -euo pipefail

          echo "Checking backend image..."
          docker manifest inspect \
            "ghcr.io/jujistu/gochatapp:${BACKEND_SHA}" >/dev/null

          echo "Checking frontend image..."
          docker manifest inspect \
            "ghcr.io/jujistu/go-chat-frontend:${FRONTEND_SHA}" >/dev/null

          echo "Checking stockbot image..."
          docker manifest inspect \
            "ghcr.io/jujistu/go-stockbot:${STOCKBOT_SHA}" >/dev/null

          echo "All promoted images exist in GHCR."

      # ----------------------------------------------------
      # UPDATE PROMOTION MANIFEST
      # ----------------------------------------------------
      - name: Update promotion manifest
        run: |
          set -euo pipefail

          cat > images.env <<EOF
          BACKEND_IMAGE=ghcr.io/jujistu/gochatapp:${BACKEND_SHA}
          FRONTEND_IMAGE=ghcr.io/jujistu/go-chat-frontend:${FRONTEND_SHA}
          STOCKBOT_IMAGE=ghcr.io/jujistu/go-stockbot:${STOCKBOT_SHA}
          EOF

          echo "=== Promotion manifest ==="
          cat images.env

      # ----------------------------------------------------
      # COMMIT PROMOTION
      # ----------------------------------------------------
      - name: Commit promotion
        id: commit_promotion
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images.env

          if git diff --cached --quiet; then
            echo "No promotion changes."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m \
            "promote: backend ${BACKEND_SHA:0:7}, frontend ${FRONTEND_SHA:0:7}, stockbot ${STOCKBOT_SHA:0:7}"

          git push

          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "Promotion committed successfully."

      # ----------------------------------------------------
      # TRIGGER STACK INTEGRATION
      # ----------------------------------------------------
      - name: Trigger stack integration validation
        if: steps.commit_promotion.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Triggering stack integration validation..."

          gh workflow run stack.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref master

          echo "Stack integration workflow dispatched successfully."
