name: Stack Security and Integration

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  stack:
    name: Compose Stack Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: go-chat-stack

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: go-chat-stack

      - name: Checkout backend
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jujistu/go-backend-ci-cd
          path: go-chat-main

      - name: Checkout frontend
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jujistu/frontend-ci-cd
          path: go-chat-react-main

      - name: Checkout stockbot
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jujistu/stock-bot
          path: go-stockbot-rabbitmq-develop

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build stack
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: docker compose build

      - name: Start stack
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: docker compose up -d

      - name: Wait for services
        run: |
          timeout 120 bash -c '
            until docker inspect --format="{{.State.Health.Status}}" go-chat-frontend 2>/dev/null | grep -q "^healthy$"; do
              docker compose ps
              sleep 3
            done
          '

      - name: Show stack status
        run: docker compose ps

      - name: Check frontend
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:8080/

      - name: Check authentication
        run: |
          response="$(curl --fail-with-body \
            -X POST http://localhost:8080/v1/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{
              "user_name": "ci-test",
              "email": "ci-test@example.com",
              "password": "CiTest123!"
            }')"

          echo "$response"

          echo "$response" | grep -q '"Token"'

      - name: Verify container security
        run: |
          for container in go-chat-backend go-chat-frontend go-stockbot; do
            echo "=== $container ==="

            docker inspect "$container" \
              --format 'User={{.Config.User}} Readonly={{.HostConfig.ReadonlyRootfs}} CapDrop={{json .HostConfig.CapDrop}}'

            test "$(docker inspect "$container" --format '{{.Config.User}}')" = "appuser"
            test "$(docker inspect "$container" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
            docker inspect "$container" \
              --format '{{json .HostConfig.CapDrop}}' | grep -q 'ALL'
          done

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v
