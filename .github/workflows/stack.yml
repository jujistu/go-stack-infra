name: Stack Security and Integration

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  stack:
    name: Compose Stack Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: go-chat-stack

    steps:
      # ----------------------------------------------------
      # CHECKOUT INFRASTRUCTURE
      # ----------------------------------------------------
      - name: Checkout infrastructure
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: go-chat-stack

      # ----------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # LOAD IMAGE MANIFEST
      # ----------------------------------------------------
      - name: Load promoted images
        run: |
          set -euo pipefail

          test -s images.env

          cat images.env

          set -a
          source images.env
          set +a

          test -n "${BACKEND_IMAGE}"
          test -n "${FRONTEND_IMAGE}"
          test -n "${STOCKBOT_IMAGE}"

          echo "Backend:  ${BACKEND_IMAGE}"
          echo "Frontend: ${FRONTEND_IMAGE}"
          echo "Stockbot: ${STOCKBOT_IMAGE}"

      # ----------------------------------------------------
      # VALIDATE COMPOSE CONFIGURATION
      # ----------------------------------------------------
      - name: Validate Compose configuration
        run: |
          set -a
          source images.env
          set +a

          docker compose config

      # ----------------------------------------------------
      # PULL EXACT VALIDATED IMAGES
      # ----------------------------------------------------
      - name: Pull application images
        run: |
          set -euo pipefail

          set -a
          source images.env
          set +a

          docker compose pull

      # ----------------------------------------------------
      # START STACK
      # ----------------------------------------------------
      - name: Start stack
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: |
          set -euo pipefail

          docker compose up -d

      # ----------------------------------------------------
      # WAIT FOR SERVICES
      # ----------------------------------------------------
      - name: Wait for services
        run: |
          set -euo pipefail

          timeout 120 bash -c '
            until \
              docker inspect --format="{{.State.Health.Status}}" go-chat-mysql 2>/dev/null | grep -q "^healthy$" &&
              docker inspect --format="{{.State.Health.Status}}" go-chat-rabbitmq 2>/dev/null | grep -q "^healthy$" &&
              docker inspect --format="{{.State.Health.Status}}" go-chat-frontend 2>/dev/null | grep -q "^healthy$" &&
              docker inspect --format="{{.State.Running}}" go-chat-backend 2>/dev/null | grep -q "^true$" &&
              docker inspect --format="{{.State.Running}}" go-stockbot 2>/dev/null | grep -q "^true$"
            do
              docker compose ps
              sleep 3
            done
          '

          echo "All stack services are ready."

      # ----------------------------------------------------
      # SHOW STACK STATUS
      # ----------------------------------------------------
      - name: Show stack status
        run: docker compose ps

      # ----------------------------------------------------
      # FRONTEND SMOKE TEST
      # ----------------------------------------------------
      - name: Check frontend
        run: |
          set -euo pipefail

          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://localhost:8080/

      # ----------------------------------------------------
      # AUTHENTICATION SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test authentication
        run: |
          set -euo pipefail

          EMAIL="ci-test-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CiTest123!"

          echo "=== Signup ==="

          signup_response="$(curl --fail-with-body \
            -X POST http://localhost:8080/v1/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d "{
              \"user_name\": \"ci-test-${GITHUB_RUN_ID}\",
              \"email\": \"${EMAIL}\",
              \"password\": \"${PASSWORD}\"
            }")"

          echo "$signup_response"

          echo "$signup_response" | grep -q '"Token"'

          echo "=== Login ==="

          login_response="$(curl --fail-with-body \
            -X POST http://localhost:8080/v1/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{
              \"email\": \"${EMAIL}\",
              \"password\": \"${PASSWORD}\"
            }")"

          echo "$login_response"

          echo "$login_response" | grep -q '"Token"'

          echo "Authentication smoke test passed."

      # ----------------------------------------------------
      # BACKEND SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test backend
        run: |
          set -euo pipefail

          echo "Checking backend container..."

          docker inspect go-chat-backend \
            --format 'Running={{.State.Running}}'

          test "$(docker inspect go-chat-backend \
            --format '{{.State.Running}}')" = "true"

          echo "Backend smoke test passed."

      # ----------------------------------------------------
      # STOCKBOT / RABBITMQ SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test Stockbot
        run: |
          set -euo pipefail

          echo "=== Stockbot logs ==="

          docker compose logs stockbot

          docker compose logs stockbot 2>&1 \
            | grep -q "Waiting for messages"

          echo "Stockbot RabbitMQ smoke test passed."

      # ----------------------------------------------------
      # VERIFY CONTAINER SECURITY
      # ----------------------------------------------------
      - name: Verify container security
        run: |
          set -euo pipefail

          for container in go-chat-backend go-chat-frontend go-stockbot; do
            echo "=== ${container} ==="

            docker inspect "${container}" \
              --format 'User={{.Config.User}} Readonly={{.HostConfig.ReadonlyRootfs}} CapDrop={{json .HostConfig.CapDrop}}'

            test "$(docker inspect "${container}" \
              --format '{{.Config.User}}')" = "appuser"

            test "$(docker inspect "${container}" \
              --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"

            docker inspect "${container}" \
              --format '{{json .HostConfig.CapDrop}}' \
              | grep -q 'ALL'
          done

      # ----------------------------------------------------
      # COLLECT LOGS ON FAILURE
      # ----------------------------------------------------
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      # ----------------------------------------------------
      # SHUTDOWN
      # ----------------------------------------------------
      - name: Shutdown
        if: always()
        run: docker compose down -v
