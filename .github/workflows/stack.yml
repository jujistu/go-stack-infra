name: Stack Security and Integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  stack:
    name: Compose Stack Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: go-chat-stack

    steps:
      # ----------------------------------------------------
      # CHECKOUT INFRASTRUCTURE
      # ----------------------------------------------------
      - name: Checkout infrastructure
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: go-chat-stack

      # ----------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # LOAD AND VALIDATE PROMOTED IMAGES
      # ----------------------------------------------------
      - name: Validate promoted images
        run: |
          set -euo pipefail

          test -s images.env

          echo "=== Promoted images ==="
          cat images.env

          grep -Eq \
            '^BACKEND_IMAGE=ghcr\.io/jujistu/gochatapp:[0-9a-f]{40}$' \
            images.env

          grep -Eq \
            '^FRONTEND_IMAGE=ghcr\.io/jujistu/go-chat-frontend:[0-9a-f]{40}$' \
            images.env

          grep -Eq \
            '^STOCKBOT_IMAGE=ghcr\.io/jujistu/go-stockbot:[0-9a-f]{40}$' \
            images.env

          echo "Promoted image references are valid."

      # ----------------------------------------------------
      # PREPARE STACK ENVIRONMENT
      # ----------------------------------------------------
      - name: Prepare stack environment
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: |
          set -euo pipefail

          test -n "${STOCK_API_KEY}"

          echo "STOCK_API_KEY=${STOCK_API_KEY}" >> images.env

      # ----------------------------------------------------
      # VALIDATE COMPOSE CONFIGURATION
      # ----------------------------------------------------
      - name: Validate Compose configuration
        run: |
          set -euo pipefail

          docker compose \
            --env-file images.env \
            config

      # ----------------------------------------------------
      # PULL EXACT VALIDATED APPLICATION IMAGES
      # ----------------------------------------------------
      - name: Pull application images
        run: |
          set -euo pipefail

          docker compose \
            --env-file images.env \
            pull

      # ----------------------------------------------------
      # START DEPENDENCIES
      # ----------------------------------------------------
      - name: Start dependencies
        run: |
          set -euo pipefail

          echo "Starting MySQL and RabbitMQ..."

          docker compose \
            --env-file images.env \
            up -d \
            mysql \
            rabbitmq

          echo "Dependency containers started."

          docker compose \
            --env-file images.env \
            ps

      # ----------------------------------------------------
      # WAIT FOR DEPENDENCIES
      # ----------------------------------------------------
      - name: Wait for dependencies
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            echo "=== Dependency readiness check ${attempt}/60 ==="

            MYSQL_STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                go-chat-mysql 2>/dev/null || true
            )"

            RABBITMQ_STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                go-chat-rabbitmq 2>/dev/null || true
            )"

            echo "MySQL:    ${MYSQL_STATUS}"
            echo "RabbitMQ: ${RABBITMQ_STATUS}"

            if [ "${MYSQL_STATUS}" = "healthy" ] &&
               [ "${RABBITMQ_STATUS}" = "healthy" ]; then

              echo "All dependencies are healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Dependencies did not become healthy within 120 seconds."

          echo "=== Compose status ==="
          docker compose \
            --env-file images.env \
            ps || true

          echo "=== MySQL logs ==="
          docker compose \
            --env-file images.env \
            logs --no-color mysql || true

          echo "=== RabbitMQ logs ==="
          docker compose \
            --env-file images.env \
            logs --no-color rabbitmq || true

          exit 1

      # ----------------------------------------------------
      # START BACKEND
      # ----------------------------------------------------
      - name: Start backend
        run: |
          set -euo pipefail

          echo "Starting backend..."

          docker compose \
            --env-file images.env \
            up -d \
            backend

          echo "Backend container started."

          docker compose \
            --env-file images.env \
            ps

      # ----------------------------------------------------
      # WAIT FOR BACKEND
      # ----------------------------------------------------
      - name: Wait for backend
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            echo "=== Backend readiness check ${attempt}/60 ==="

            BACKEND_STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                go-chat-backend 2>/dev/null || true
            )"

            echo "Backend: ${BACKEND_STATUS}"

            if [ "${BACKEND_STATUS}" = "healthy" ]; then
              echo "Backend is healthy."
              exit 0
            fi

            if [ "${BACKEND_STATUS}" = "unhealthy" ]; then
              echo "=== Backend health check logs ==="

              docker inspect \
                go-chat-backend \
                --format='{{range .State.Health.Log}}{{println .Start "|" .ExitCode "|" .Output}}{{end}}' \
                2>/dev/null || true

              echo "=== Backend application logs ==="

              docker compose \
                --env-file images.env \
                logs --no-color --tail=100 backend || true
            fi

            sleep 3
          done

          echo "Backend did not become healthy within 180 seconds."

          echo "=== Final backend health status ==="

          docker inspect \
            go-chat-backend \
            --format='{{json .State.Health}}' \
            2>/dev/null || true

          echo "=== Backend logs ==="

          docker compose \
            --env-file images.env \
            logs --no-color backend || true

          exit 1

      # ----------------------------------------------------
      # START FRONTEND AND STOCKBOT
      # ----------------------------------------------------
      - name: Start frontend and Stockbot
        run: |
          set -euo pipefail

          echo "Starting frontend and Stockbot..."

          docker compose \
            --env-file images.env \
            up -d \
            frontend \
            stockbot

          echo "Frontend and Stockbot containers started."

          docker compose \
            --env-file images.env \
            ps

      # ----------------------------------------------------
      # WAIT FOR FRONTEND AND STOCKBOT
      # ----------------------------------------------------
      - name: Wait for frontend and Stockbot
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            echo "=== Application readiness check ${attempt}/60 ==="

            FRONTEND_STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                go-chat-frontend 2>/dev/null || true
            )"

            STOCKBOT_RUNNING="$(
              docker inspect \
                --format='{{.State.Running}}' \
                go-stockbot 2>/dev/null || true
            )"

            echo "Frontend: ${FRONTEND_STATUS}"
            echo "Stockbot: ${STOCKBOT_RUNNING}"

            if [ "${FRONTEND_STATUS}" = "healthy" ] &&
               [ "${STOCKBOT_RUNNING}" = "true" ]; then

              echo "Frontend and Stockbot are ready."
              exit 0
            fi

            if [ "${FRONTEND_STATUS}" = "unhealthy" ]; then
              echo "=== Frontend health check logs ==="

              docker inspect \
                go-chat-frontend \
                --format='{{range .State.Health.Log}}{{println .Start "|" .ExitCode "|" .Output}}{{end}}' \
                2>/dev/null || true

              echo "=== Frontend application logs ==="

              docker compose \
                --env-file images.env \
                logs --no-color --tail=100 frontend || true
            fi

            if [ "${STOCKBOT_RUNNING}" != "true" ]; then
              echo "=== Stockbot logs ==="

              docker compose \
                --env-file images.env \
                logs --no-color --tail=100 stockbot || true
            fi

            echo "=== Compose status ==="

            docker compose \
              --env-file images.env \
              ps

            sleep 3
          done

          echo "Frontend and Stockbot did not become ready within 180 seconds."

          echo "=== Final Compose status ==="

          docker compose \
            --env-file images.env \
            ps || true

          echo "=== All Compose logs ==="

          docker compose \
            --env-file images.env \
            logs --no-color || true

          exit 1

      # ----------------------------------------------------
      # SHOW STACK STATUS
      # ----------------------------------------------------
      - name: Show stack status
        run: |
          set -euo pipefail

          docker compose \
            --env-file images.env \
            ps

      # ----------------------------------------------------
      # FRONTEND SMOKE TEST
      # ----------------------------------------------------
      - name: Check frontend
        run: |
          set -euo pipefail

          curl \
            --fail \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            http://localhost:8080/

          echo "Frontend smoke test passed."

      # ----------------------------------------------------
      # AUTHENTICATION SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test authentication
        run: |
          set -euo pipefail

          EMAIL="ci-test-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CiTest123!"

          for attempt in {1..10}; do
            echo "Authentication attempt ${attempt}/10"

            if signup_response="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                -X POST \
                http://localhost:8080/v1/api/auth/signup \
                -H 'Content-Type: application/json' \
                -d "{
                  \"user_name\": \"ci-test-${GITHUB_RUN_ID}\",
                  \"email\": \"${EMAIL}\",
                  \"password\": \"${PASSWORD}\"
                }"
            )"; then

              echo "$signup_response"

              echo "$signup_response" | grep -q '"Token"'

              echo "Authentication smoke test passed."
              break
            fi

            if [ "${attempt}" -eq 10 ]; then
              echo "Authentication service failed."

              echo "=== Compose status ==="
              docker compose \
                --env-file images.env \
                ps

              echo "=== Backend logs ==="
              docker compose \
                --env-file images.env \
                logs --no-color backend || true

              echo "=== Frontend logs ==="
              docker compose \
                --env-file images.env \
                logs --no-color frontend || true

              exit 1
            fi

            echo "Authentication endpoint not ready yet."
            sleep 2
          done

      # ----------------------------------------------------
      # BACKEND SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test backend
        run: |
          set -euo pipefail

          echo "Checking backend health endpoint..."

          docker compose \
            --env-file images.env \
            exec -T backend \
            wget -qO- \
            http://127.0.0.1:9010/health/ready

          echo "Backend smoke test passed."

      # ----------------------------------------------------
      # STOCKBOT / RABBITMQ SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test Stockbot
        run: |
          set -euo pipefail

          echo "=== Stockbot logs ==="

          docker compose \
            --env-file images.env \
            logs --no-color stockbot

          docker compose \
            --env-file images.env \
            logs --no-color stockbot 2>&1 \
            | grep -q "Waiting for messages"

          echo "Stockbot RabbitMQ smoke test passed."

      # ----------------------------------------------------
      # VERIFY CONTAINER SECURITY
      # ----------------------------------------------------
      - name: Verify container security
        run: |
          set -euo pipefail

          for container in \
            go-chat-backend \
            go-chat-frontend \
            go-stockbot
          do
            echo "=== ${container} ==="

            docker inspect "${container}" \
              --format 'User={{.Config.User}} Readonly={{.HostConfig.ReadonlyRootfs}} CapDrop={{json .HostConfig.CapDrop}}'

            test "$(
              docker inspect "${container}" \
                --format '{{.Config.User}}'
            )" = "appuser"

            test "$(
              docker inspect "${container}" \
                --format '{{.HostConfig.ReadonlyRootfs}}'
            )" = "true"

            docker inspect "${container}" \
              --format '{{json .HostConfig.CapDrop}}' \
              | grep -q 'ALL'
          done

          echo "Container security verification passed."

      # ----------------------------------------------------
      # COLLECT LOGS ON FAILURE
      # ----------------------------------------------------
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Compose status ==="

          docker compose \
            --env-file images.env \
            ps || true

          echo "=== Backend health status ==="

          docker inspect \
            go-chat-backend \
            --format='{{json .State.Health}}' \
            2>/dev/null || true

          echo "=== Frontend health status ==="

          docker inspect \
            go-chat-frontend \
            --format='{{json .State.Health}}' \
            2>/dev/null || true

          echo "=== Compose logs ==="

          docker compose \
            --env-file images.env \
            logs --no-color || true

      # ----------------------------------------------------
      # SHUTDOWN
      # ----------------------------------------------------
      - name: Shutdown
        if: always()
        run: |
          docker compose \
            --env-file images.env \
            down -v
