name: Stack Security and Integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  stack:
    name: Compose Stack Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: go-chat-stack

    steps:
      # ----------------------------------------------------
      # CHECKOUT INFRASTRUCTURE
      # ----------------------------------------------------
      - name: Checkout infrastructure
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: go-chat-stack

      # ----------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # LOAD AND VALIDATE PROMOTED IMAGES
      # ----------------------------------------------------
      - name: Validate promoted images
        run: |
          set -euo pipefail

          test -s images.env

          echo "=== Promoted images ==="
          cat images.env

          grep -Eq \
            '^BACKEND_IMAGE=ghcr\.io/jujistu/gochatapp:[0-9a-f]{40}$' \
            images.env

          grep -Eq \
            '^FRONTEND_IMAGE=ghcr\.io/jujistu/go-chat-frontend:[0-9a-f]{40}$' \
            images.env

          grep -Eq \
            '^STOCKBOT_IMAGE=ghcr\.io/jujistu/go-stockbot:[0-9a-f]{40}$' \
            images.env

          echo "Promoted image references are valid."

      # ----------------------------------------------------
      # VALIDATE COMPOSE CONFIGURATION
      # ----------------------------------------------------
      - name: Validate Compose configuration
        run: |
          set -euo pipefail

          docker compose \
            --env-file images.env \
            config

      # ----------------------------------------------------
      # PULL EXACT VALIDATED APPLICATION IMAGES
      # ----------------------------------------------------
      - name: Pull application images
        run: |
          set -euo pipefail

          docker compose \
            --env-file images.env \
            pull

      # ----------------------------------------------------
      # START STACK
      # ----------------------------------------------------
      - name: Start stack
        env:
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: |
          set -euo pipefail

          docker compose \
            --env-file images.env \
            up -d

      # ----------------------------------------------------
      # WAIT FOR SERVICES
      # ----------------------------------------------------
      - name: Wait for services
        run: |
          set -euo pipefail

          timeout 120 bash -c '
            until \
              docker inspect --format="{{.State.Health.Status}}" go-chat-mysql 2>/dev/null | grep -q "^healthy$" &&
              docker inspect --format="{{.State.Health.Status}}" go-chat-rabbitmq 2>/dev/null | grep -q "^healthy$" &&
              docker inspect --format="{{.State.Health.Status}}" go-chat-frontend 2>/dev/null | grep -q "^healthy$" &&
              docker inspect --format="{{.State.Running}}" go-chat-backend 2>/dev/null | grep -q "^true$" &&
              docker inspect --format="{{.State.Running}}" go-stockbot 2>/dev/null | grep -q "^true$"
            do
              docker compose \
                --env-file images.env \
                ps

              sleep 3
            done
          '

          echo "All stack services are ready."

      # ----------------------------------------------------
      # SHOW STACK STATUS
      # ----------------------------------------------------
      - name: Show stack status
        run: |
          docker compose \
            --env-file images.env \
            ps

      # ----------------------------------------------------
      # FRONTEND SMOKE TEST
      # ----------------------------------------------------
      - name: Check frontend
        run: |
          set -euo pipefail

          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://localhost:8080/

      # ----------------------------------------------------
      # AUTHENTICATION SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test authentication
        run: |
          set -euo pipefail

          EMAIL="ci-test-${GITHUB_RUN_ID}@example.com"
          PASSWORD="CiTest123!"

          for attempt in {1..30}; do
            echo "Authentication attempt ${attempt}/30"

            if signup_response="$(curl --silent --show-error --fail-with-body \
              -X POST http://localhost:8080/v1/api/auth/signup \
              -H 'Content-Type: application/json' \
              -d "{
                \"user_name\": \"ci-test-${GITHUB_RUN_ID}\",
                \"email\": \"${EMAIL}\",
                \"password\": \"${PASSWORD}\"
              }")"; then

              echo "$signup_response"
              echo "$signup_response" | grep -q '"Token"'

              echo "Authentication smoke test passed."
              exit 0
            fi

            echo "Backend not ready yet."
            docker compose --env-file images.env ps
            sleep 2
          done

          echo "Authentication service failed to become ready."
          docker compose --env-file images.env logs backend
          exit 1

      # ----------------------------------------------------
      # BACKEND SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test backend
        run: |
          set -euo pipefail

          echo "Checking backend container..."

          docker inspect go-chat-backend \
            --format 'Running={{.State.Running}}'

          test "$(docker inspect go-chat-backend \
            --format '{{.State.Running}}')" = "true"

          echo "Backend smoke test passed."

      # ----------------------------------------------------
      # STOCKBOT / RABBITMQ SMOKE TEST
      # ----------------------------------------------------
      - name: Smoke test Stockbot
        run: |
          set -euo pipefail

          echo "=== Stockbot logs ==="

          docker compose \
            --env-file images.env \
            logs stockbot

          docker compose \
            --env-file images.env \
            logs stockbot 2>&1 \
            | grep -q "Waiting for messages"

          echo "Stockbot RabbitMQ smoke test passed."

      # ----------------------------------------------------
      # VERIFY CONTAINER SECURITY
      # ----------------------------------------------------
      - name: Verify container security
        run: |
          set -euo pipefail

          for container in \
            go-chat-backend \
            go-chat-frontend \
            go-stockbot
          do
            echo "=== ${container} ==="

            docker inspect "${container}" \
              --format 'User={{.Config.User}} Readonly={{.HostConfig.ReadonlyRootfs}} CapDrop={{json .HostConfig.CapDrop}}'

            test "$(docker inspect "${container}" \
              --format '{{.Config.User}}')" = "appuser"

            test "$(docker inspect "${container}" \
              --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"

            docker inspect "${container}" \
              --format '{{json .HostConfig.CapDrop}}' \
              | grep -q 'ALL'
          done

      # ----------------------------------------------------
      # COLLECT LOGS ON FAILURE
      # ----------------------------------------------------
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file images.env \
            logs --no-color

      # ----------------------------------------------------
      # SHUTDOWN
      # ----------------------------------------------------
      - name: Shutdown
        if: always()
        run: |
          docker compose \
            --env-file images.env \
            down -v
